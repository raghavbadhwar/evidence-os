[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "proofcounsel-ingest"
version = "0.1.0"
description = "Quality-gated, PageIndex-compatible document ingestion and retrieval runtime"
requires-python = ">=3.12"
dependencies = [
  "charset-normalizer>=3.4,<4",
  "filetype>=1.2,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "portalocker>=3,<4",
  "snowballstemmer>=3.1,<4",
]

[project.scripts]
evidence-agent = "proofcounsel_ingest.evidence.agent_cli:main"
proofcounsel-ingest = "proofcounsel_ingest.cli:main"

[dependency-groups]
evidence = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pageindex==0.2.10",
]
evidence-test = [
  {include-group = "evidence"},
  {include-group = "dev"},
  "pymupdf>=1.25,<3",
]
core = []
pdf = [
  "pypdf>=5,<7",
]
office = [
  "lxml>=5,<7",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "python-docx>=1.1,<2",
  "python-pptx>=1,<2",
]
ocr = [
  "ocrmypdf>=16,<18",
]
semantic = []
postgres = [
  "boto3>=1.35,<2",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "hypothesis>=6.120,<7",
  "lxml-stubs>=0.5,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proofcounsel_ingest"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: uses external parser processes or persistent stores",
  "legacy: characterizes the pre-production prototype",
  "slow: takes more than two seconds",
  "load: exercises bounded synthetic scale",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["proofcounsel_ingest"]
